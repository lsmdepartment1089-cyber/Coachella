<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coachella Photobooth — Guest Display</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#27251F;color:#FFF4D6;font-family:Arial,sans-serif;overflow:hidden}.screen{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 3vw;gap:1.5vh}header{font-weight:900;font-size:clamp(24px,3vw,55px);color:#FFC72C;letter-spacing:.08em;text-align:center}.sub{font-size:clamp(18px,2vw,35px);font-weight:bold;text-align:center;min-height:1.4em}.frame{position:relative;flex:1;min-height:0;max-width:95vw;display:flex;justify-content:center;align-items:center}.frame img{display:block;max-height:100%;max-width:100%;object-fit:contain;border:8px solid #FFC72C;border-radius:18px;background:#161512}.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(32vh,30vw);font-weight:900;color:#fff;text-shadow:0 7px 30px #000}.count[hidden],#qrWrap[hidden]{display:none}footer{text-align:center;font-size:clamp(15px,1.5vw,24px);padding:1vh}#qrWrap{display:flex;align-items:center;justify-content:center;gap:20px;background:#FFF4D6;color:#27251F;border-radius:15px;padding:12px 24px;font-size:clamp(16px,2vw,30px);font-weight:900}#qr{background:white;padding:8px}#qr img{display:block}#offline{color:#FFC72C}
</style></head><body><div class="screen"><header>COACHELLA · BEYOND THE ARCHES</header><div class="sub" id="heading">Your photobooth preview</div><div class="frame"><img id="preview" alt="Live photobooth camera preview"><div class="count" id="count" hidden></div></div><div id="qrWrap" hidden><div id="qr"></div><span>SCAN TO DOWNLOAD YOUR PHOTO</span></div><footer id="offline">Waiting for the laptop photobooth…</footer></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const channel='BroadcastChannel' in window ? new BroadcastChannel('coachella-booth-display-v1') : null;
let lastFrame='',lastQr='',lastSeen=0,mode='home';
function state(d){mode=d.mode||'home';$('heading').textContent=mode==='shoot'?(d.shotInfo||'Smile!'):mode==='result'?'Your photo is ready!':'Get ready for your photo!';$('count').textContent=d.count||'';$('count').hidden=!(mode==='shoot'&&d.count);$('qrWrap').hidden=!(mode==='result'&&d.qrUrl);if(mode==='result'&&d.qrUrl&&d.qrUrl!==lastQr){lastQr=d.qrUrl;$('qr').textContent='';if(window.QRCode)new QRCode($('qr'),{text:lastQr,width:150,height:150});}if(mode!=='result')lastQr='';$('offline').textContent=mode==='home'?'Use the laptop to select a layout and press START':mode==='shoot'?'Look at the camera and smile!':(d.status||'Scan your photo QR code');}
if(channel){channel.onmessage=e=>{const d=e.data||{};lastSeen=Date.now();if(d.type==='state')state(d);if(d.type==='frame'&&d.blob){const url=URL.createObjectURL(d.blob);const im=$('preview');im.onload=()=>{if(lastFrame)URL.revokeObjectURL(lastFrame);lastFrame=url};im.src=url;}if(d.type==='offline')$('offline').textContent='Laptop booth disconnected';};channel.postMessage({type:'ready'});setInterval(()=>{if(Date.now()-lastSeen>3000)$('offline').textContent='Waiting for laptop photobooth connection…';},1000);}else{$('offline').textContent='Use Chrome or Edge for the HDMI guest display.';}
document.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')document.documentElement.requestFullscreen().catch(()=>{});});
</script></body></html>

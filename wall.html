<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Wall | McDonald's Year End Party</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{--red:#DA291C;--yellow:#FFC72C;--dark:#27251F;--cream:#FFF4D6;--orange:#FF8A1F;--display:'Londrina Solid','Arial Narrow',sans-serif;--body:'Nunito Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--body);background:#27251F;color:#fff;overflow:hidden;color-scheme:light}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
@keyframes drift{from{transform:translateX(-700px)}to{transform:translateX(2700px)}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes popIn{0%{opacity:0;transform:scale(.3) rotate(var(--rot,0deg))}70%{transform:scale(1.07) rotate(var(--rot,0deg))}100%{opacity:1;transform:scale(1) rotate(var(--rot,0deg))}}
@keyframes spotIn{0%{opacity:0;transform:scale(.4) rotate(-8deg)}70%{transform:scale(1.04) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(-1.5deg)}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{50%{box-shadow:0 0 0 14px rgba(255,199,44,.35)}}
.btn{cursor:pointer;border:3px solid var(--dark);border-radius:12px;padding:8px 14px;font-family:var(--display);font-size:1.05rem;letter-spacing:.04em;background:var(--red);color:#fff;box-shadow:3px 3px 0 var(--dark);transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .18s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--dark)}
.btn.y{background:var(--yellow);color:var(--dark)}.btn.w{background:#fff;color:var(--dark)}.btn.d{background:var(--dark);color:var(--yellow)}
.btn.s{font-size:.85rem;padding:4px 10px;box-shadow:2px 2px 0 var(--dark)}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#DA291C,#FF8A1F);padding:20px}
.card{background:var(--cream);color:var(--dark);border:3px solid var(--dark);border-radius:20px;padding:22px;box-shadow:8px 8px 0 var(--dark);width:min(100%,400px)}
.card h1{font:400 2rem var(--display);color:var(--red);margin-bottom:6px}
.card input{width:100%;padding:9px 11px;border:3px solid var(--dark);border-radius:10px;margin:8px 0 12px;color:var(--dark)}
.msg{font-weight:800;font-size:.85rem;color:#B0170E;min-height:1.2em;margin-top:6px}
#wall{position:fixed;inset:0;overflow:hidden;--hh:19vh;--bb:7vh}
.bgw{position:absolute;inset:0;background:linear-gradient(180deg,#DA291C 0%,#F25C1F 38%,#FF9E1B 68%,#FFC72C 100%);overflow:hidden}
.sunb{position:absolute;left:50%;bottom:16%;width:min(90vw,1100px);aspect-ratio:1;margin-left:calc(min(90vw,1100px) / -2);border-radius:50%;background:radial-gradient(circle,#FFF6C8 0%,#FFD34D 45%,rgba(255,211,77,0) 70%)}
.cl{position:absolute;left:0;border-radius:999px;background:rgba(255,230,180,.45);filter:blur(14px);animation:drift 90s linear infinite}
.cl.c1{top:12%;width:420px;height:70px;animation-delay:-20s}.cl.c2{top:30%;width:560px;height:90px;animation-duration:120s;animation-delay:-70s}.cl.c3{top:6%;width:300px;height:56px;animation-duration:100s;animation-delay:-5s}
.hl2{position:absolute;left:0;bottom:0;width:100%;height:46vh}
.wheel{transform-box:fill-box;transform-origin:center;animation:turn 90s linear infinite}
.wh{position:absolute;z-index:3;left:0;right:0;top:0;height:var(--hh);text-align:center;padding-top:1.4vh}
.warch{height:5vh;filter:drop-shadow(0 3px 0 rgba(39,37,31,.4))}
.ws{font-weight:800;text-transform:uppercase;letter-spacing:.45em;padding-left:.45em;font-size:clamp(.55rem,1.5vh,1rem);color:#FFE9A8}
.wh h1{font:900 min(8vh,5.5rem) var(--display);text-transform:uppercase;letter-spacing:.04em;line-height:1;text-shadow:0 .08em 0 var(--dark),0 .15em .4em rgba(0,0,0,.35)}
.wp{font:400 min(2.6vh,1.7rem) var(--display);color:var(--yellow);letter-spacing:.06em;text-shadow:0 3px 0 var(--dark),0 0 12px rgba(39,37,31,.6)}
.ws{text-shadow:0 2px 6px rgba(39,37,31,.7)}
.count{position:absolute;right:2vw;top:2vh;font:400 min(3.4vh,2rem) var(--display);color:var(--yellow);text-shadow:0 3px 0 var(--dark)}
#board{position:absolute;z-index:2;left:3vw;right:3vw;top:var(--hh);bottom:var(--bb);display:grid;gap:1.4vmin}
.slot{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:.8vmin;transform:rotate(var(--rot,0deg))}
.slot img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 .8vmin 2.2vmin rgba(0,0,0,.5);border-radius:4px;background:#fff;animation:popIn .8s both}
.slot.empty{border:.5vmin dashed rgba(255,244,214,.55);border-radius:2vmin;color:rgba(255,244,214,.8);font:400 min(3vh,1.8rem) var(--display);text-align:center;padding:1vmin}
.hintbar{position:absolute;z-index:3;left:0;right:0;bottom:1.6vh;text-align:center;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.6rem,1.8vh,1.1rem);color:var(--cream);text-shadow:0 2px 6px rgba(0,0,0,.6)}
#spot{position:absolute;inset:0;z-index:30;background:radial-gradient(circle,rgba(218,41,28,.9),rgba(39,37,31,.96));display:flex;align-items:center;justify-content:center;flex-direction:column;animation:fadeIn .5s both}
.snew{font:900 min(9vh,6rem) var(--display);text-transform:uppercase;color:var(--yellow);text-shadow:0 .06em 0 var(--dark);animation:rise .6s both}
#spImg{max-width:80vw;max-height:66vh;border:1vmin solid #fff;box-shadow:0 2vmin 6vmin rgba(0,0,0,.6);animation:spotIn .9s cubic-bezier(.2,1.2,.4,1) .1s both}
#spName{font:400 min(7vh,4.5rem) var(--display);color:#fff;text-shadow:0 .06em 0 var(--dark);margin-top:1.6vh;animation:rise .7s .7s both}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:31}
.ctl{position:absolute;z-index:20;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
#manage{position:absolute;z-index:25;top:0;right:0;bottom:0;width:min(100%,430px);background:var(--cream);color:var(--dark);border-left:4px solid var(--dark);padding:14px;overflow:auto}
#manage h2{font:400 1.7rem var(--display);color:var(--red);margin:4px 0 8px}
#manage h3{font:400 1.2rem var(--display);margin:12px 0 6px}
.chk{display:flex;gap:8px;align-items:center;font-weight:800;margin:8px 0}
.chk input{width:20px;height:20px;accent-color:var(--red)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.mi{border:3px solid var(--dark);border-radius:10px;overflow:hidden;background:#fff;font-size:.72rem;font-weight:800}
.mi img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}
.mi div{padding:3px 5px;display:flex;gap:4px;align-items:center;justify-content:space-between}
body.presenting .ctl,body.presenting #manage{display:none!important}
body.presenting.idle{cursor:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="gate" hidden>
  <form class="card" id="gateForm">
    <h1>Photo Wall</h1>
    <p style="font-size:.92rem">Organizers only. Enter the organizer password.</p>
    <input type="password" id="pw" autocomplete="current-password" required aria-label="Organizer password">
    <button class="btn" id="gateBtn" type="submit" style="width:100%">Open the wall</button>
    <div class="msg" id="gateMsg" role="status"></div>
    <button class="btn s w" id="gateBack" type="button" style="margin-top:8px">Back to organizer desk</button>
  </form>
</div>

<div id="wall" hidden>
  <div class="bgw" id="bgw"></div>
  <header class="wh">
    <svg class="warch" viewBox="0 0 120 80" aria-hidden="true"><path d="M12 74V38C12 -4 56 -4 60 38 64 -4 108 -4 108 38V74" fill="none" stroke="#FFC72C" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p class="ws">Coachella: Beyond the Arches</p><h1>Photo Wall</h1><p class="wp" id="party"></p>
  </header>
  <div class="count" id="count"></div>
  <div id="board"></div>
  <p class="hintbar">Open your invitation, tap Photo Wall, then Take a picture!</p>
  <div class="ctl" id="ctl">
    <button class="btn s y" id="manageB" type="button">Manage photos (M)</button>
    <button class="btn s w" id="presentB" type="button">Present full screen (F)</button>
    <button class="btn s d" id="backB" type="button">Back to organizer desk</button>
  </div>
  <aside id="manage" hidden>
    <h2>Manage photos</h2>
    <label class="chk"><input type="checkbox" id="mod"> Approve new photos before they appear</label>
    <p class="msg" id="mMsg" style="color:#1B7A3D"></p>
    <h3>Waiting for approval</h3><div class="mgrid" id="mPend"></div>
    <h3>On the wall</h3><div class="mgrid" id="mOn"></div>
    <h3>Hidden</h3><div class="mgrid" id="mOff"></div>
    <button class="btn s w" id="mClose" type="button" style="margin-top:14px">Close</button>
  </aside>
  <div id="spot" hidden><p class="snew">New photo!</p><img id="spImg" alt="New photo"><p id="spName"></p><canvas id="fx" aria-hidden="true"></canvas></div>
</div>

<script>
const $ = id => document.getElementById(id);
const C = window.CONFIG;
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const BUCKET = C.wallBucket || 'photo-wall';
const SS = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} }, del: k => { try { sessionStorage.removeItem(k); } catch (e) {} } };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pub = p => sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl;
let pw = null, photos = [], seen = new Set(), first = true, slots = [], queue = [], spotBusy = false, mode = 'off', pollT = null;

function hills() {
  let w = '<circle cx="600" cy="262" r="112"/><circle cx="600" cy="262" r="94" opacity=".6"/>';
  for (let i = 0; i < 20; i++) { const a = i * Math.PI / 10, x = (600 + 112 * Math.cos(a)).toFixed(1), y = (262 + 112 * Math.sin(a)).toFixed(1); w += `<line x1="600" y1="262" x2="${x}" y2="${y}"/><circle cx="${x}" cy="${y}" r="6" fill="${i % 2 ? '#FFC72C' : '#DA291C'}" stroke="#27251F" stroke-width="1.5"/>`; }
  return `<svg class="hl2" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMax slice"><path d="M0 320V190l120-30 150 30 140-40 160 35 150-45 170 50 150-30 160 25v175z" fill="#A8301F" opacity=".8"/><path d="M0 320V235l200-45 180 30 190-35 210 40 220-30 200 25v100z" fill="#6B1F16"/><g stroke="#FFF4D6" stroke-width="2" fill="none" opacity=".95"><line x1="600" y1="262" x2="545" y2="330"/><line x1="600" y1="262" x2="655" y2="330"/><g class="wheel">${w}</g></g><path d="M0 320V282l260-20 240 18 220-14 260 20 220-16v50z" fill="#27251F"/></svg>`;
}
$('bgw').innerHTML = '<div class="sunb"></div><div class="cl c1"></div><div class="cl c2"></div><div class="cl c3"></div>' + hills();
$('party').textContent = C.partyName;

/* ---------- login ---------- */
async function enter(password) {
  const r = await sb.rpc('admin_wall_list', { p_password: password }); if (r.error) return r.error.message;
  pw = password; SS.set('fest_admin_pw', password); $('gate').hidden = true; $('wall').hidden = false; apply(r.data); layoutBoard(); fillInitial(); clearInterval(pollT); pollT = setInterval(poll, 4000); setInterval(swapOne, 5500); return null;
}
$('gateForm').addEventListener('submit', async e => { e.preventDefault(); $('gateBtn').disabled = true; $('gateMsg').textContent = ''; const err = await enter($('pw').value); $('gateBtn').disabled = false; if (err) $('gateMsg').textContent = err; });
$('gateBack').addEventListener('click', () => { location.href = 'index.html#admin'; }); $('backB').addEventListener('click', () => { location.href = 'index.html#admin'; });

/* ---------- data ---------- */
const approved = () => photos.filter(p => p.status === 'approved');
function apply(d) { mode = d.mode; photos = d.photos || []; $('mod').checked = mode === 'on'; $('count').textContent = approved().length + ' photos'; }
async function poll() {
  const r = await sb.rpc('admin_wall_list', { p_password: pw }); if (r.error) return; apply(r.data);
  const ap = approved(), fresh = ap.filter(p => !seen.has(p.id)); ap.forEach(p => seen.add(p.id));
  fresh.reverse().forEach(p => queue.push(p)); runQueue(); cleanBoard(); renderManage();
}

/* ---------- board ---------- */
function layoutBoard() {
  const b = $('board'), w = b.clientWidth || innerWidth * .94, h = b.clientHeight || innerHeight * .74; let best = null;
  for (let r = 1; r <= 5; r++) for (let c = 2; c <= 10; c++) { const n = r * c; if (n < 6 || n > 24) continue; const sc = Math.abs(Math.log((w / c) / (h / r) / .78)); if (!best || sc < best.sc) best = { r, c, sc }; }
  b.style.gridTemplateColumns = `repeat(${best.c},1fr)`; b.style.gridTemplateRows = `repeat(${best.r},1fr)`; b.textContent = ''; slots = [];
  for (let i = 0; i < best.r * best.c; i++) { const el = document.createElement('div'); el.className = 'slot empty'; el.style.setProperty('--rot', (Math.random() * 6 - 3).toFixed(1) + 'deg'); el.textContent = 'Your photo here'; b.appendChild(el); slots.push({ el, p: null }); }
}
function put(s, p) {
  s.p = p; s.el.textContent = ''; s.el.classList.toggle('empty', !p);
  if (!p) { s.el.textContent = 'Your photo here'; return; }
  const im = new Image(); im.alt = 'Photo by ' + p.nickname; im.src = pub(p.path); s.el.appendChild(im);
}
const shown = () => new Set(slots.filter(s => s.p).map(s => s.p.id));
function fillInitial() { const ap = approved(); ap.forEach(p => seen.add(p.id)); slots.forEach((s, i) => put(s, ap[i] || null)); first = false; }
function cleanBoard() {
  const ids = new Set(approved().map(p => p.id));
  slots.forEach(s => { if (s.p && !ids.has(s.p.id)) put(s, null); });
  const sh = shown(), rest = approved().filter(p => !sh.has(p.id));
  slots.forEach(s => { if (!s.p && rest.length) put(s, rest.shift()); });
}
function swapOne() {
  if (!slots.length || spotBusy) return; const sh = shown(), rest = approved().filter(p => !sh.has(p.id)); if (!rest.length) return;
  put(slots[Math.floor(Math.random() * slots.length)], rest[Math.floor(Math.random() * rest.length)]);
}
addEventListener('resize', () => { if (!$('wall').hidden) { const keep = slots.map(s => s.p); layoutBoard(); slots.forEach((s, i) => put(s, keep[i] || null)); } });

/* ---------- spotlight for new photos ---------- */
function confetti() {
  if (reduce) return; const cv = $('fx'), c = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight; const cols = ['#FFC72C', '#DA291C', '#FF8A1F', '#FFF4D6', '#fff'], ps = [];
  const burst = (x, d) => { for (let i = 0; i < 80; i++) ps.push({ x, y: innerHeight * .85, vx: d * (4 + Math.random() * 9) + (Math.random() - .5) * 3, vy: -(10 + Math.random() * 14), w: 8 + Math.random() * 8, h: 10 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % 5] }); };
  burst(0, 1); burst(innerWidth, -1); const end = performance.now() + 4500;
  (function f() { const now = performance.now(); c.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.vy += .28; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr; c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); });
    if (now < end && ps.some(p => p.y < innerHeight + 30)) requestAnimationFrame(f); else c.clearRect(0, 0, cv.width, cv.height); })();
}
async function runQueue() {
  if (spotBusy || !queue.length) return; spotBusy = true; const p = queue.shift(), im = $('spImg');
  await new Promise(res => { im.onload = res; im.onerror = res; im.src = pub(p.path); setTimeout(res, 2500); });
  $('spName').textContent = 'by ' + p.nickname; const sp = $('spot'); sp.hidden = false; sp.querySelectorAll('.snew,#spImg,#spName').forEach(el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }); confetti();
  await sleep(7000); sp.hidden = true;
  const empty = slots.find(s => !s.p), target = empty || slots[Math.floor(Math.random() * slots.length)]; if (target) put(target, p);
  spotBusy = false; runQueue();
}

/* ---------- manage panel ---------- */
async function setStatus(id, st) { const r = await sb.rpc('admin_wall_set_status', { p_password: pw, p_id: id, p_status: st }); if (r.error) { $('mMsg').style.color = '#B0170E'; $('mMsg').textContent = r.error.message; return; } $('mMsg').textContent = ''; await poll(); }
function item(p, btns) { const d = document.createElement('div'), im = document.createElement('img'), row = document.createElement('div'), n = document.createElement('span'); d.className = 'mi'; im.src = pub(p.path); im.alt = 'Photo by ' + p.nickname; n.textContent = p.nickname; row.appendChild(n); btns.forEach(([t, st, cls]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn s ' + cls; b.textContent = t; b.addEventListener('click', () => setStatus(p.id, st)); row.appendChild(b); }); d.append(im, row); return d; }
function renderManage() {
  if ($('manage').hidden) return; [['mPend', 'pending', [['Approve', 'approved', 'y'], ['No', 'hidden', 'w']]], ['mOn', 'approved', [['Hide', 'hidden', 'w']]], ['mOff', 'hidden', [['Show', 'approved', 'y']]]].forEach(([id, st, b]) => { const g = $(id); g.textContent = ''; const l = photos.filter(p => p.status === st); if (!l.length) { const e = document.createElement('p'); e.style.cssText = 'font-size:.8rem;opacity:.7'; e.textContent = 'None'; g.appendChild(e); } l.forEach(p => g.appendChild(item(p, b))); });
}
$('manageB').addEventListener('click', () => { $('manage').hidden = !$('manage').hidden; renderManage(); }); $('mClose').addEventListener('click', () => { $('manage').hidden = true; });
$('mod').addEventListener('change', async () => { const r = await sb.rpc('admin_wall_set_mode', { p_password: pw, p_mode: $('mod').checked ? 'on' : 'off' }); $('mMsg').style.color = r.error ? '#B0170E' : '#1B7A3D'; $('mMsg').textContent = r.error ? r.error.message : ($('mod').checked ? 'New photos now wait for your approval.' : 'New photos appear right away.'); });

/* ---------- presenting ---------- */
function togglePresent() { if (document.fullscreenElement || document.body.classList.contains('presenting')) { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); document.body.classList.remove('presenting'); return; } const el = document.documentElement; (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => document.body.classList.add('presenting')); }
document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('presenting', !!document.fullscreenElement); setTimeout(() => addEventListener, 0); });
$('presentB').addEventListener('click', togglePresent);
let idleT; document.addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); });
document.addEventListener('keydown', e => { if ($('wall').hidden || e.target.tagName === 'INPUT') return; const k = e.key.toLowerCase(); if (k === 'f') togglePresent(); else if (k === 'm') { $('manage').hidden = !$('manage').hidden; renderManage(); } else if (k === 'escape') { $('manage').hidden = true; if (document.body.classList.contains('presenting') && !document.fullscreenElement) document.body.classList.remove('presenting'); } });

(async () => { const sp = SS.get('fest_admin_pw'); if (sp) { const err = await enter(sp); if (!err) return; SS.del('fest_admin_pw'); } $('gate').hidden = false; })();
</script>
</body>
</html>
